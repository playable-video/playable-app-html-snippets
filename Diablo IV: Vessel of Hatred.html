<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://fonts.googleapis.com/css?family=Object+Sans|Noto+Sans" rel="stylesheet">
    <title>Test IAM™</title>
    <style>
        :root {
            --font-title: "Object Sans", sans-serif;
            --font-button: "Object Sans", sans-serif;
            --font-description: "Noto Sans", sans-serif;
        }

        /* Box sizing rules */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        /* Remove default padding */
        ul[class],
        ol[class] {
            padding: 0;
        }

        /* Remove default margin */
        body,
        h1,
        h2,
        h3,
        h4,
        p,
        ul[class],
        ol[class],
        li,
        figure,
        figcaption,
        blockquote,
        dl,
        dd {
            margin: 0;
        }

        /* Set core body defaults */
        body {
            scroll-behavior: smooth;
            text-rendering: optimizeSpeed;
            line-height: 1.25;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Remove list styles on ul, ol elements with a class attribute */
        ul[class],
        ol[class] {
            list-style: none;
        }

        /* A elements that don't have a class get default styles */
        a:not([class]) {
            text-decoration-skip-ink: auto;
        }

        /* Make images easier to work with */
        img {
            max-width: 100%;
            display: block;
        }

        /* Natural flow and rhythm in articles by default */
        article>*+* {
            margin-top: 1em;
        }

        /* Inherit fonts for inputs and buttons */
        input,
        button,
        a,
        textarea,
        select {
            font: inherit;
        }

        button,
        a {
            border: none;
            background-color: transparent;
            text-decoration: none;
        }

        .overlay {
            /* full screen overlay, dims background */
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 100vw;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 99999;
        }

        .modal {
            /* foreground modal */
            height: auto;
            max-width: 300px;
            flex-basis: 300px;
            margin: auto;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: rgba(21, 23, 30, 1);
            border-radius: 8px;
        }

        .modal__image {
            /* image container */
            max-height: 400px;
            max-width: 260px;
            margin: auto;
            margin-top: 50px;
            object-fit: cover;
            border-radius: 4px;
        }

        .modal__image video {
            /* video within image container */
            height: 100%;
            width: 100%;
            object-fit: cover;
            border-radius: 4px;
        }

        .modal__content {
            /* text container below image */
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 32px 16px 32px 16px;
        }

        .modal__cross {
            /* close button */
            position: absolute;
            top: 15px;
            left: 16px;
            height: 24px;
            width: 24px;
            cursor: pointer;
            z-index: 1;
            display: flex !important;
            justify-content: center;
            padding: 1px;
        }

        .modal__mute {
            /* mute button, if video has sound */
            position: absolute;
            top: 15px;
            right: 16px;
            height: 24px;
            width: 24px;
            cursor: pointer;
            z-index: 1;
            display: flex !important;
            justify-content: center;
            padding: 1px;
        }

        .modal__title {
            /* title text */
            margin-bottom: 8px;
            font-size: 16px;
            line-height: 1.2;
            color: #ffffff;
            font-family: var(--font-title);
            text-align: center;
        }

        .modal__sub-title {
            /* description text */
            margin: auto;
            font-family: var(--font-description);
            font-size: 14px;
            font-weight: 400;
            line-height: 1.25;
            color: #ffffff;
            text-align: center;
            max-width: 260px;
        }

        .modal__text {
            /* body text */
            margin: auto;
            font-family: var(--font-description);
            font-size: 14px;
            font-weight: 400;
            line-height: 1.25;
            color: #ffffff;
            text-align: center;
            max-width: 260px;
        }

        .modal__button-wrap {
            /* button container */
            display: flex;
            justify-content: space-between;
            margin-top: 32px;
        }

        .modal__btn {
            /* button style */
            border-radius: 4px;
            font-family: var(--font-button);
            font-weight: 700;
            min-height: 40px;
            max-height: 40px;
            width: 160px;
            align-items: center;
            display: flex;
            justify-content: center;
            text-align: center;
            margin: 0 auto;
        }

        .modal__btn--main {
            /* primary button style */
            color: #ffffff;
            font-size: 16px;
            background-color: #0074E0;
            background-size: 167px 40px;
            background-repeat: no-repeat;
        }

        /* this is the secondary button style, can be used if they want the buttons to appear different*/
        .modal__btn--secondary {
            color: #ffffff;
            font-size: 16px;
            background-color: rgba(255, 255, 255, 0.12);
            background-size: 167px 40px;
            background-repeat: no-repeat;
        }

        .hide {
            display: none;
        }

        .fade {
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .show {
            opacity: 1;
        }

        .txt-style {
            border-radius: 20px;
        }

        /*Phones*/
        /* Small devices (portrait tablets and large phones) */

        @media (max-width: 360px) and (min-width: 0px) {
            .modal__image {
                max-height: 260px;
            }

            .modal__title {
                font-size: 19px;
            }

            .modal__sub-title {
                font-size: 0.7rem;
            }
        }

        @media (max-width: 380px) and (min-width: 350px),
        (max-height: 700px) and (min-height: 600px) {
            .modal__image {
                max-height: 260px;
            }

            .modal__title {
                font-size: 19px;
            }

            .modal__sub-title {
                font-size: 0.7rem;
            }
        }

        /* Medium devices (landscape tablets, 768px and up) */
        @media (max-width: 400px) and (min-width: 380px),
        (max-height: 800px) and (min-height: 700px) {
            .modal__image {
                max-height: 290px;
            }

            .modal__title {
                font-size: 20px;
            }

            .modal__sub-title {
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>
    <div class="overlay">
        <div class="modal">
            <a data-button-id="close" class="modal__cross" onclick="brazeBridge.logClick('close');brazeBridge.closeMessage()">

                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path fill-rule="evenodd" clip-rule="evenodd"
                        d="M3.38576 5.19485L10.3569 12L3.38576 18.8051C2.87141 19.3073 2.87141 20.1213 3.38576 20.6234C3.90011 21.1255 4.73404 21.1255 5.24839 20.6234L12 14.0326L18.7516 20.6234C19.266 21.1255 20.0999 21.1255 20.6142 20.6234C21.1286 20.1213 21.1286 19.3073 20.6142 18.8051L13.6431 12L20.6142 5.19485C21.1286 4.69275 21.1286 3.87868 20.6142 3.37658C20.0999 2.87447 19.266 2.87447 18.7516 3.37658L12 9.96744L5.24839 3.37658C4.73404 2.87447 3.90011 2.87447 3.38576 3.37658C2.87141 3.87868 2.87141 4.69275 3.38576 5.19485Z"
                        fill="white" />
                </svg>
            </a>
            <a button-id="mute" class="modal__mute" onclick="toggleSound();brazeBridge.logClick('mute')">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 640 512" fill="white"><path d="M301.1 34.8C312.6 40 320 51.4 320 64V448c0 12.6-7.4 24-18.9 29.2s-25 3.1-34.4-5.3L131.8 352H64c-35.3 0-64-28.7-64-64V224c0-35.3 28.7-64 64-64h67.8L266.7 40.1c9.4-8.4 22.9-10.4 34.4-5.3zM425 167l55 55 55-55c9.4-9.4 24.6-9.4 33.9 0s9.4 24.6 0 33.9l-55 55 55 55c9.4 9.4 9.4 24.6 0 33.9s-24.6 9.4-33.9 0l-55-55-55 55c-9.4 9.4-24.6 9.4-33.9 0s-9.4-24.6 0-33.9l55-55-55-55c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0z"></path></svg>
            </a>
            <div class="modal__image">
                <video id="video" muted autoplay playsinline loop>
                    <source id="source" src="https://cdn.playable.video/editor/6577238220472320/clickplay.mp4"
                        type="video/mp4">
                </video>
            </div>
            <div class="modal__content">
                <h1 id="title" class="modal__title">PLAY ONE OF THE YEAR'S BIGGEST RELEASES</h1>
                <h2 id="sub_title" class="modal__sub-title">Experience Diablo IV in its finest form with major savings on Vessel of Hatred through January 6.</h2>
                <div id="options" class="modal__button-wrap">
                    <a href="https://shop.battle.net/product/diablo-iv"
                        class="modal__btn modal__btn--secondary" onclick="brazeBridge.logClick('Shop')">Buy Now</a>
                </div>
            </div>
        </div>
    </div>

    <script>

        document.querySelectorAll('[data-button-id]').forEach(function (node) {
            node.addEventListener('click', function () {
                brazeBridge.closeMessage();
            });
        });

        function toggleSound() {
            var video = document.getElementById('video');
            var muteButton = document.querySelector('.modal__mute');
            video.muted = !video.muted;
            console.log('Sound toggled. Muted:', video.muted);
            if (video.muted) {
                muteButton.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 640 512" fill="white"><path d="M301.1 34.8C312.6 40 320 51.4 320 64V448c0 12.6-7.4 24-18.9 29.2s-25 3.1-34.4-5.3L131.8 352H64c-35.3 0-64-28.7-64-64V224c0-35.3 28.7-64 64-64h67.8L266.7 40.1c9.4-8.4 22.9-10.4 34.4-5.3zM425 167l55 55 55-55c9.4-9.4 24.6-9.4 33.9 0s9.4 24.6 0 33.9l-55 55 55 55c9.4 9.4 9.4 24.6 0 33.9s-24.6 9.4-33.9 0l-55-55-55 55c-9.4 9.4-24.6 9.4-33.9 0s-9.4-24.6 0-33.9l55-55-55-55c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0z"></path></svg>';
            } else {
                muteButton.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 640 512" fill="white"><path d="M533.6 32.5C598.5 85.3 640 165.8 640 256s-41.5 170.8-106.4 223.5c-10.3 8.4-25.4 6.8-33.8-3.5s-6.8-25.4 3.5-33.8C557.5 398.2 592 331.2 592 256s-34.5-142.2-88.7-186.3c-10.3-8.4-11.8-23.5-3.5-33.8s23.5-11.8 33.8-3.5zM473.1 107c43.2 35.2 70.9 88.9 70.9 149s-27.7 113.8-70.9 149c-10.3 8.4-25.4 6.8-33.8-3.5s-6.8-25.4 3.5-33.8C475.3 341.3 496 301.1 496 256s-20.7-85.3-53.2-111.8c-10.3-8.4-11.8-23.5-3.5-33.8s23.5-11.8 33.8-3.5zm-60.5 74.5C434.1 199.1 448 225.9 448 256s-13.9 56.9-35.4 74.5c-10.3 8.4-25.4 6.8-33.8-3.5s-6.8-25.4 3.5-33.8C393.1 284.4 400 271 400 256s-6.9-28.4-17.7-37.3c-10.3-8.4-11.8-23.5-3.5-33.8s23.5-11.8 33.8-3.5zM301.1 34.8C312.6 40 320 51.4 320 64V448c0 12.6-7.4 24-18.9 29.2s-25 3.1-34.4-5.3L131.8 352H64c-35.3 0-64-28.7-64-64V224c0-35.3 28.7-64 64-64h67.8L266.7 40.1c9.4-8.4 22.9-10.4 34.4-5.3z"></path></svg>';
            }
        }
    </script>


</body>

</html>
